<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DevFolio">
  <title>DevFolio</title>
  <defs>
    <linearGradient id="df-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="df-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#df-tile)"/>

  <!-- Geometric D, drawn rather than set from a font so the weight holds at 16px.
       Outer silhouette first, then the counter, cut with fill-rule="evenodd". -->
  <path fill="#ffffff" fill-rule="evenodd" d="M128 112 H240 C297 112 344 162 344 224 C344 286 297 336 240 336 H128 Z M184 164 V284 H240 C268 284 290 258 290 224 C290 190 268 164 240 164 Z"/>

  <!-- The signature accent rule: the same stroke that draws under the headline. -->
  <rect x="128" y="372" width="216" height="28" rx="14" fill="url(#df-rule)"/>
</svg>
